experiment_id: om-plugins
description: >
  Keyword-trigger regression check for the om* skills. Both arms keep "Skill" in
  allowed_tools so the only variable is whether the plugins are offered at all —
  the baseline arm proves the criterion can report "no", which is what makes a
  "yes" in the treatment arm mean something.

  Plugin paths come from `${CE_PLUGIN_*}`, resolved per machine by
  `eval/scripts/plugin_env.py` — run `eval "$(python3 eval/scripts/plugin_env.py)"`
  first. These pointed at the source checkouts (`~/oh-my-project`) until
  2026-08-17; they now name the *installed* plugins, which is both portable and
  what actually loads at runtime.

defaults:
  agent:
    type: claude-code
    permission_mode: acceptEdits
    allowed_tools: ["Skill", "Read", "Glob", "Grep"]
    model: "claude-sonnet-5"
  repeats: 1

variants:
  - variant_id: no-plugins
    description: "om* plugins absent — control"
    agent:
      plugins: []

  - variant_id: with-plugins
    description: "om* plugins offered"
    agent:
      plugins:
        - type: "local"
          path: "${CE_PLUGIN_OMP}"
        - type: "local"
          path: "${CE_PLUGIN_OMX}"
        - type: "local"
          path: "${CE_PLUGIN_OMD}"
