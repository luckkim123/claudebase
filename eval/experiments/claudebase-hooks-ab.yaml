experiment_id: claudebase-hooks-ab
description: >
  DEC-2. Every prior experiment in this directory — harness-ab, harness-discipline,
  om-plugins, om-with-only — ran under coder_eval's setting_sources default,
  ["project"] (claude_code_agent.py:1196), because no experiment YAML here ever
  set it otherwise. That default means NEITHER arm of any prior experiment
  loaded ~/.claude/CLAUDE.md or the 22 claudebase hooks wired into
  ~/.claude/settings.json (PreToolUse/UserPromptSubmit/Stop/SessionStart) — see
  eval/README.md's "Traps" section, "`plugins` is the only variable, by
  construction". This experiment lifts exactly that boundary.

  What ht-user-project actually loads beyond h0-project, after both fix rounds
  below: ~/.claude/CLAUDE.md + the env block (7 vars, including 3 route-gate
  vars — see NOT NEUTRALIZED below) + the 22 hooks wired into
  ~/.claude/settings.json's hooks block. NOT what it loads: enabledPlugins (16
  entries, neutralized to {} for both arms) or the outputStyle /
  alwaysThinkingEnabled / effortLevel scalars (neutralized to h0-project's
  implicit defaults for both arms — see SCALAR NEUTRALIZATION below). `model`
  needs no neutralization: defaults.agent.model pins "claude-sonnet-5" for
  both arms already, applied independently of setting_sources.

  The only variable is setting_sources itself:
    - h0-project:       ["project"]          — the condition every prior experiment ran under
    - ht-user-project:  ["user", "project"]  — adds ~/.claude/CLAUDE.md + env + the 22 hooks

  NOT NEUTRALIZED — env: ~/.claude/settings.json's `env` block (7 vars,
  including the 3 route-gate vars documented in
  machine_thinking_effort_coupling and the omha routing hooks) is left to
  diverge between arms on purpose. Unlike the plugin/scalar confounds above,
  the env block is not incidental settings-file noise — it is how the
  deployed hook layer itself is switched on (route gates read these vars at
  hook-fire time), so it is part of what "the 22 hooks" under test actually
  are, not a confound alongside them. claude_settings has no mechanism to
  neutralize env selectively without also stripping the vars the hooks
  themselves depend on, so this axis stays unpinned and is treated as within
  scope of what the experiment measures.

  PLUGIN-LAYER FIX (Fix Round 1): `plugins: []` alone does NOT make the plugin
  layer identical. `plugins` maps only to `--plugin-dir`
  (claude_code_agent.py:1153/1185, subprocess_cli.py:722-728), an ad-hoc local-
  directory loader that is entirely separate from `enabledPlugins`, a sibling
  top-level key in ~/.claude/settings.json (confirmed: 16 entries on this
  machine). `setting_sources: ["user", "project"]` loads that file wholesale,
  so ht-user-project would silently pick up 16 real plugins that h0-project
  never sees — exactly the confound this design is supposed to rule out.
  Fix: `claude_settings.enabledPlugins: {}`, set once in defaults so both arms
  get the identical override. `claude_settings` maps to the SDK's `--settings`
  flag, documented as "the flag settings layer, which has the highest priority
  among user-controlled settings" (claude_agent_sdk types.py:2006-2012) and
  applied unconditionally regardless of setting_sources
  (subprocess_cli.py:647-650) — so it is not itself gated by the variable under
  test. CAVEAT: whether an empty object at that layer REPLACES or MERGES with
  the lower `user`-layer's populated `enabledPlugins` could not be confirmed
  from readable SDK source (the merge algorithm lives in the compiled `claude`
  CLI, not the Python wrapper) — do not treat this as proven. A hardcoded list
  of this machine's 16 plugin ids as a belt-and-suspenders `false` map was
  considered and rejected: this is a distributed repo (claudebase ships to
  every machine, see scripts/plugin_env.py's own docstring on exactly this
  trap) and `claude_settings` has no `${VAR}` expansion — only `plugins[].path`
  gets that (utils.py:42, process_plugins) — so a hardcoded list would silently
  stop covering the true enabledPlugins set on any other machine.

  BEFORE STEP 4: verify empirically, don't trust the above. Run one cheap probe
  per arm (a single `claude -p` turn per arm asking it to list every
  plugin/skill it can see is enough — not a full `coder-eval run`) and confirm
  ht-user-project's active plugin list is empty and equals h0-project's. If it
  is not empty, the mechanism above did not hold and the design needs a real
  fix (e.g. extending plugin_env.py to also resolve a per-machine
  enabledPlugins-off file), not another guess.

  SECOND PROBE ASSERTION (Fix Round 2, I2) — the plugin-list check above only
  rules out ONE failure direction (settings loaded when they shouldn't be).
  It cannot detect the opposite: if `--settings` REPLACES rather than MERGES
  with the `user`-layer settings (the CAVEAT above, still unconfirmed), then
  `claude_settings: {enabledPlugins: {}, ...}` alone could wipe out the
  user-layer's `hooks` block along with `enabledPlugins`, silently dropping
  all 22 claudebase hooks from ht-user-project too — the probe would still
  pass (plugin lists equal and empty) while the experiment measured nothing.
  This branch's own firing-log instrumentation (runtime/hooks/hooklog.py,
  wired into all 12 previously-silent hooks) makes that checkable for free:
  after the same probe turn, assert ht-user-project's sandbox cwd gained at
  least one `.omc/logs/*.jsonl` file (any hook fired) AND h0-project's sandbox
  cwd gained none. If ht-user-project's `.omc/logs/` is empty too, REPLACE
  won by the CAVEAT above and the yaml needs a real fix before Step 4, not a
  rerun.

  PROBE EXECUTED (2026-08-22, this machine) — both directions resolved:
  (1) With the old inline `enabledPlugins: {}`, the treatment arm still ran
  the plugin layer: the omha UserPromptSubmit ROUTE injection appeared in its
  probe output, and omha is wired ONLY as a plugin (grep of
  ~/.claude/settings.json hooks: no route_emit/omha entry). So `--settings`
  deep-MERGES with the user layer and an empty map merges as a no-op — the
  REPLACE branch of the CAVEAT is dead, and so is the hooks-dropped failure
  mode of the SECOND PROBE ASSERTION (treatment sandbox gained
  .omc/logs/{hud_ensure,tokensave_guard}.jsonl; control sandbox gained none).
  (2) Re-run with an explicit per-key false-map over this machine's 16
  enabledPlugins: zero plugin-namespaced skills visible in the treatment arm,
  ~/.claude/CLAUDE.md still loaded, firing logs still created. That false-map
  is therefore the fix, generated per machine (see claude_settings below).
  Probe sandboxes must NOT live under ~/.claude (a first attempt put them in
  ~/.claude/jobs/...: ancestor-directory CLAUDE.md discovery walked up into
  ~/.claude/CLAUDE.md and contaminated the control arm) — use mktemp -d
  under /tmp. Re-run both probe assertions on any new machine before Step 4;
  the mechanism is confirmed here, not everywhere.

  Sonnet only, mirroring harness-discipline.yaml's stage-1 gate: this axis is
  unproven, so don't spend opus tokens on it yet. Task: leaves_a_check.yaml —
  the only task in this directory confirmed to discriminate (0.333 vs 1.000,
  reproduced at n=3 on 2026-08-17). repeats: 3 because this is a new design
  with unmeasured variance (the harness-discipline stage-1 trap: run 3 once to
  learn a new design's variance, then stop paying for replicates only once
  that variance comes back 0).

defaults:
  agent:
    type: claude-code
    permission_mode: bypassPermissions
    allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
    model: "claude-sonnet-5"
    plugins: []
    # Best-effort suppression of settings-derived plugins (see description,
    # "PLUGIN-LAYER FIX") — set once here, identically for both arms. Not
    # proven to REPLACE (vs merge with) the user-layer's enabledPlugins; the
    # pre-Step-4 probe is the actual verification gate.
    #
    # SCALAR NEUTRALIZATION (Fix Round 2, I1): this machine's
    # ~/.claude/settings.json also carries outputStyle: "Concise",
    # alwaysThinkingEnabled: true, effortLevel: "xhigh" — h0-project never
    # loads that file (setting_sources=["project"]) but ht-user-project does,
    # so without pinning these here the two arms would silently diverge on
    # reasoning budget and response-formatting discipline, not just on hooks.
    # Each value below is the one h0-project already runs with implicitly
    # (verified against claude-agent-sdk 0.1.77's cli.js, not assumed):
    #   - outputStyle: "default" — cli.js: `xD="default"`; `UQ()?.outputStyle
    #     || xD` is the fallback used everywhere the style is read, and
    #     `if (Q === xD) return []` skips injecting any style content — this
    #     is the literal built-in-default sentinel, not a placeholder string.
    #   - alwaysThinkingEnabled: true — settings schema: "When absent or
    #     true, thinking is enabled automatically." Key-absent (h0-project's
    #     actual state) and explicit true are the same behavior, so pinning
    #     true changes nothing for h0-project and only stops ht-user-project
    #     from reading it off ~/.claude/settings.json instead.
    #   - effortLevel: "unset" — cli.js `h4A()`: `if (B === "unset") return`
    #     is checked before the `B !== void 0` branch that applies an actual
    #     override, so the string "unset" and true key-absence resolve
    #     identically (no reasoning-effort override sent). Using the literal
    #     sentinel (rather than omitting the key) keeps this arm-symmetric —
    #     both arms get the identical explicit key via claude_settings.
    # model is already pinned above via defaults.agent.model, which the SDK
    # applies independently of setting_sources — no separate claude_settings
    # entry needed.
    # FIX ROUND 3 (2026-08-22): the inline dict this used to be is gone — the
    # probe below proved `enabledPlugins: {}` is a no-op (deep-MERGE with the
    # user layer, not REPLACE), so the neutralization now lives in a file that
    # scripts/plugin_env.py writes per machine: an explicit per-key false-map
    # over this machine's real enabledPlugins, plus the same three scalars.
    # The path is fixed and machine-independent; the content is not. The
    # already-mandatory `eval "$(python3 scripts/plugin_env.py)"` pre-run step
    # is what materializes it — claude_settings as a string passes through to
    # `--settings` verbatim (claude_code_agent.py:1198-1200).
    claude_settings: "/tmp/claudebase-eval-neutralize-settings.json"
  repeats: 3

variants:
  - variant_id: h0-project
    description: "setting_sources=[project] — CLAUDE.md and the 22 claudebase hooks excluded (the condition every prior experiment ran under, unchanged)"
    agent:
      setting_sources: ["project"]

  - variant_id: ht-user-project
    description: "setting_sources=[user, project] — loads ~/.claude/CLAUDE.md and the 22 claudebase hooks in ~/.claude/settings.json"
    agent:
      setting_sources: ["user", "project"]
