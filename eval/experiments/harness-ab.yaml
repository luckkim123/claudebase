experiment_id: harness-ab
description: >
  Phase C. H_0 (no harness) vs H_T (the plugin layer this machine actually runs),
  crossed with two model tiers. Both tiers are required: arXiv 2605.30621 finds
  harness-benefit is non-monotonic — strong tiers hit a ceiling and gain less —
  so measuring Opus alone would read a real benefit as "the harness is useless".

  WHAT IS ACTUALLY OFF IN H_0, measured not assumed:
  coder_eval sets setting_sources=["project"] (claude_code_agent.py:1196) and the
  sandbox is a fresh tempdir, so NEITHER arm loads ~/.claude/CLAUDE.md, the 21
  claudebase hooks, gateguard, or any user-scope setting. The only variable is
  the plugin list. This experiment therefore measures the om*/ponytail/superpowers
  PLUGIN layer, not the whole harness — the claudebase hook layer is absent from
  both arms and is out of scope here.

defaults:
  agent:
    type: claude-code
    permission_mode: bypassPermissions
    allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
  repeats: 1

variants:
  - variant_id: h0-sonnet
    description: "no plugins, sonnet-5"
    agent:
      model: "claude-sonnet-5"
      plugins: []

  - variant_id: ht-sonnet
    description: "full plugin layer, sonnet-5"
    agent:
      model: "claude-sonnet-5"
      plugins: &full_stack
        - type: "local"
          path: "${CE_PLUGIN_OMC}"
        - type: "local"
          path: "${CE_PLUGIN_PONYTAIL}"
        - type: "local"
          path: "${CE_PLUGIN_SUPERPOWERS}"
        - type: "local"
          path: "${CE_PLUGIN_OMHA}"
        - type: "local"
          path: "${CE_PLUGIN_OMP}"
        - type: "local"
          path: "${CE_PLUGIN_OMX}"
        - type: "local"
          path: "${CE_PLUGIN_OMD}"
        - type: "local"
          path: "${CE_PLUGIN_OMS}"

  - variant_id: h0-opus
    description: "no plugins, opus-5"
    agent:
      model: "claude-opus-5"
      plugins: []

  - variant_id: ht-opus
    description: "full plugin layer, opus-5"
    agent:
      model: "claude-opus-5"
      plugins: *full_stack
