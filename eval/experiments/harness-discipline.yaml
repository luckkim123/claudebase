experiment_id: harness-discipline
description: >
  Phase C, redesigned. The first attempt scored "did it write correct code" and
  every arm hit 1.000 — the harness makes no such claim, and its ROUTE line was
  the only thing it contributed (Skill calls: 0). These tasks score what the
  harness DOES claim: stay in scope, fix the root cause, leave a check, and
  treat a question as a question.

  Every axis is something H_0 is capable of and simply has no instruction to do,
  which is what keeps it off the ceiling.

  Stage 1 is sonnet-only on purpose. arXiv 2605.30621 still requires both tiers
  before any verdict, but spending Opus tokens on a design whose discriminating
  power is unproven is how the last attempt burned $9.76 for a flat result.
  Add h0-opus/ht-opus only if stage 1 separates.

  Same measurement boundary as harness-ab: setting_sources=["project"] plus a
  fresh tempdir means NEITHER arm loads ~/.claude/CLAUDE.md or the claudebase
  hooks. The plugin list is the only variable.

  Plugin paths come from `${CE_PLUGIN_*}`, resolved per machine by
  `eval/scripts/plugin_env.py` — run `eval "$(python3 eval/scripts/plugin_env.py)"`
  first. Literal paths were removed on 2026-08-17: they pinned one home directory
  (unrunnable elsewhere, and claudebase ships everywhere) and one version each,
  and superseded versions stay in the plugin cache, so 4 of these 8 pins still
  resolved while naming a harness that no longer existed.

defaults:
  agent:
    type: claude-code
    permission_mode: bypassPermissions
    allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
    model: "claude-sonnet-5"
  repeats: 3

variants:
  - variant_id: h0-sonnet
    description: "no plugins"
    agent:
      plugins: []

  - variant_id: ht-sonnet
    description: "full plugin layer"
    agent:
      plugins:
        - type: "local"
          path: "${CE_PLUGIN_OMC}"
        - type: "local"
          path: "${CE_PLUGIN_PONYTAIL}"
        - type: "local"
          path: "${CE_PLUGIN_SUPERPOWERS}"
        - type: "local"
          path: "${CE_PLUGIN_OMHA}"
        - type: "local"
          path: "${CE_PLUGIN_OMP}"
        - type: "local"
          path: "${CE_PLUGIN_OMX}"
        - type: "local"
          path: "${CE_PLUGIN_OMD}"
        - type: "local"
          path: "${CE_PLUGIN_OMS}"
