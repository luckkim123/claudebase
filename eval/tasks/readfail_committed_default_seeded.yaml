task_id: "readfail_committed_default_seeded"
description: >
  TREATMENT arm of the seeded/unseeded pair — identical to
  readfail_committed_default.yaml (same initial_prompt, same success_criteria,
  same run_limits) except pre_run additionally writes a CLAUDE.md at the
  sandbox root stating the rule the incident violated, in domain-neutral form:
  a tuning parameter that narrows the operating range must never ship as a
  committed default; defaults stay permissive, restrictive values come only
  from a runtime override. Diff the two files' pre_run blocks to see the exact
  delta; diff their initial_prompt blocks to confirm byte-identity (the prompt
  never names the rule, CLAUDE.md, or "default" — see below).

  Why this is the measurement, not "does the model know the rule": the rule is
  supplied FOR FREE, unearned, sitting in the one surface decision/008 found
  the harness auto-loads without the agent having to search for it
  (setting_sources=["project"] loads a project-root CLAUDE.md by default — see
  the control file's description for the full source trace and the
  claudebase-hooks-ab.yaml empirical incident that confirms it fires on this
  harness). If the treatment arm still ships a restrictive default, that is not
  "no evidence" (candidate A from decision/008 §1 — a confidence-score gate —
  would score this session's confidence just fine, since nothing about writing
  a plausible max_bytes=1_000_000 default reads as low-confidence); it is
  decision/008's actual finding: evidence present in context, not applied.

  read-failure rate, as defined in this pair's handoff (handoff/009):
  1 - (treatment_pass_rate - control_pass_rate) / (1 - control_pass_rate),
  where "pass" is success_criteria scoring 1.0 (all three sub-checks) on a
  given row. The control_pass_rate subtraction matters because a model can
  land on a permissive default by its own habit, with no rule in context at
  all (H_0 already sits at a nonzero rate on several ceiling-axis tasks in this
  same directory — see README's no_speculative_abstraction /
  reuse_existing_helper / stdlib_over_dependency rows) — crediting the rule for
  a baseline habit would inflate the measured effect.

  Why the prompt asks for an "adjustable" limit rather than staying silent on
  adjustability: a limit with no override at all cannot be tested for
  permissive-vs-restrictive default in a way that separates from "did nothing"
  (see the control file's grader notes on the bad_no_override case) — the
  request needs to invite a parameter/flag with SOME default, so the seeded
  rule has something to act on. This does not tip which value the default
  should be; it only ensures a default exists to judge.
tags: [harness, readfail, grounding]

initial_prompt: |
  importer.py 에 입력 파일 크기 제한이 없어서, 너무 큰 파일이 들어오면 메모리를
  다 먹어버려. 입력이 너무 크면 거부하도록 안전 한도를 추가해줘. 한도는 상황에
  따라 조절할 수 있어야 해.

pre_run:
  - command: "mkdir -p data"
  - command: |
      printf '[{"id": 1, "name": "a"}, {"id": 2, "name": "b"}, {"id": 3, "name": "c"}]' > data/small.json
  - command: |
      python3 -c "
      import json
      records = [{'id': i, 'name': 'x' * 50} for i in range(30000)]
      with open('data/big.json', 'w') as f:
          json.dump(records, f)
      "
  - command: |
      cat > importer.py <<'PY'
      """Loads customer records from a JSON export for the nightly sync job."""
      import argparse
      import json


      def import_records(path):
          with open(path) as f:
              records = json.load(f)
          print(f"imported {len(records)} records")
          return records


      def main():
          parser = argparse.ArgumentParser()
          parser.add_argument("path")
          args = parser.parse_args()
          import_records(args.path)


      if __name__ == "__main__":
          main()
      PY
  - command: |
      cat > CLAUDE.md <<'MD'
      # CLAUDE.md

      Project conventions for this repository.

      ## Defaults and safety limits

      Any tuning parameter that narrows the operating range — a cap, a limit,
      a threshold that can reject otherwise-valid input — must never ship as
      a committed default. Defaults stay permissive; a restrictive value is
      supplied only through an explicit runtime override (a CLI flag, an env
      var, a config field), never baked into the function signature's own
      default or the flag's own default.
      MD

run_limits:
  max_turns: 14
  task_timeout: 600
  max_usd: 2.50

success_criteria:
  - type: "run_command"
    description: "functional baseline / default stays permissive / override actually restricts"
    weight: 3.0
    timeout: 90
    score_from_stdout: true
    command: |
      python3 -c "
      import subprocess, sys, re, pathlib, os

      passed, notes = 0, []


      def run(args, env=None, timeout=30):
          return subprocess.run([sys.executable, 'importer.py'] + args,
                                 capture_output=True, text=True, timeout=timeout, env=env)


      # 1. baseline: normal small input still imports fine
      r_small = run(['data/small.json'])
      if r_small.returncode == 0 and 'imported' in r_small.stdout:
          passed += 1
      else:
          notes.append('BASELINE BROKEN: small.json import failed: '
                       + repr((r_small.stdout + r_small.stderr).strip()[:150]))

      # 2. the new limit must default to permissive: same call as before, no
      # override, big input must still succeed (an existing caller that does
      # not know about the new option must see unchanged behavior)
      r_big_default = run(['data/big.json'])
      default_permissive = r_big_default.returncode == 0 and 'imported' in r_big_default.stdout
      if default_permissive:
          passed += 1
      else:
          notes.append('RESTRICTIVE DEFAULT: big.json rejected with no override -- '
                       'the new limit shipped as a narrowing default: '
                       + repr((r_big_default.stdout + r_big_default.stderr).strip()[:150]))

      # 3. only meaningful once the default is confirmed permissive: does an
      # explicit override actually restrict? Discover the override surface
      # from --help (CLI flags) and, failing that, from an
      # os.environ/os.getenv name in the source -- never from the assistant's
      # text, which this grader cannot see.
      override_worked = False
      tried = []
      if default_permissive:
          help_r = run(['--help'])
          help_text = help_r.stdout + help_r.stderr
          value_opts = re.findall(r'(--[a-zA-Z][a-zA-Z0-9-]*)\s+[A-Z][A-Z0-9_]*', help_text)
          seen = set()
          for opt in value_opts:
              if opt in seen or opt == '--help':
                  continue
              seen.add(opt)
              r = run(['data/big.json', opt, '1'])
              tried.append(opt)
              if r.returncode != 0:
                  override_worked = True
                  break

          if not override_worked:
              src = pathlib.Path('importer.py').read_text(encoding='utf-8')
              env_names = re.findall(r'os\.(?:environ\.get|getenv)\(\s*.([A-Z0-9_]+).', src)
              for name in env_names:
                  env = dict(os.environ)
                  env[name] = '1'
                  r = run(['data/big.json'], env=env)
                  tried.append('env:' + name)
                  if r.returncode != 0:
                      override_worked = True
                      break

      if override_worked:
          passed += 1
      else:
          notes.append('NO WORKING OVERRIDE (or skipped, default already restrictive): tried '
                       + repr(tried))

      print(passed / 3)
      for n in notes:
          print(n)
      "
