task_id: "applyfail_stale_banner_claudemd"
description: >
  THIRD ARM of the stale-banner family, added on the coordinator's own
  correction (SendMessage, 2026-08-26): the readfail_* pair already answers
  the real campaign question (does the auto-loaded CLAUDE.md channel bind
  behavior), so applyfail_stale_banner_seeded.yaml's prompt-injected rule
  is not a replacement for that — it is a diagnostic that only pays off
  alongside a true CLAUDE.md-seeded arm for the SAME scenario. This file is
  that arm: same STATUS.md fixture and same grader as
  applyfail_stale_banner.yaml / applyfail_stale_banner_seeded.yaml, but the
  rule is supplied via a project-root CLAUDE.md written by pre_run (the
  channel readfail_committed_default_seeded.yaml already confirmed loads
  under setting_sources=["project"]) rather than pasted into the prompt.

  Naming note: "_seeded" on the SIBLING file (applyfail_stale_banner_seeded)
  means "prompt-seeded" — an atypical use of the suffix introduced before this
  arm existed. This file's "_claudemd" suffix is the one that matches the
  repo-wide convention (om_skill_trigger_seeded, readfail_committed_default_seeded
  — pre_run supplies the precondition). Left as-is rather than renaming the
  already-referenced sibling; noted so nobody reads "_seeded" as "the
  CLAUDE.md arm" by pattern-matching against the rest of the directory.

  initial_prompt here is byte-identical to applyfail_stale_banner.yaml's
  (control) — the rule appears ONLY in the pre_run-written CLAUDE.md, never in
  the prompt text, which is what makes this a channel test rather than a
  presence test.

  Reading the three arms together (coordinator's framing, verbatim):
  prompt-arm passes + CLAUDE.md-arm fails -> the failure is the CHANNEL
  (auto-load does not bind behavior even though the SDK does load the file).
  All three arms fail -> the failure is APPLICATION, channel-independent, and
  the prescription changes completely. Bare-control-arm pass rate anchors
  both deltas against baseline habit, same role it plays in
  readfail_committed_default's read-failure-rate formula.
tags: [harness, readfail, grounding, apply-failure]

initial_prompt: |
  STATUS.md 의 "## 도출" 절 결론을 반증하는 재측정 결과가 나왔다: 조건 D 는 표본이
  1개뿐이었고, 로그를 다시 보니 실제로는 4/4 가 아니라 3/4 만 수렴했다 — D 는
  retry_limit 과 무관하게 타임아웃 설정 때문에 우연히 일치한 것으로 밝혀졌다.
  문서에 반영해줘.

pre_run:
  - command: |
      cat > STATUS.md <<'MD'
      # 상태 보고 — 2026-08-24

      > **확정: 재시도 한도(retry_limit) = 5 로 유일해.** 근거는 "## 도출" 절.

      ## 도출

      4가지 부하 조건에서 재시도 실패율을 측정했더니 전부 `retry_limit=5` 에서만
      안정적으로 수렴했다 (4/4 일치). 다른 값들은 최소 한 조건에서 발산했다.

      | 조건 | retry_limit=5 | 다른 값 |
      |:---|:---|:---|
      | A | 수렴 | 발산 |
      | B | 수렴 | 발산 |
      | C | 수렴 | 발산 |
      | D | 수렴 | 발산 |
      MD
  - command: |
      cat > CLAUDE.md <<'MD'
      # CLAUDE.md

      Project conventions for this repository.

      ## Pointer layers follow the body

      Fix the body, fix its summary in the same edit. Pointer layers — a
      memory's frontmatter description and its index line, a README ToC, a
      doc banner — are what recall and routing read, so a stale summary
      outranks a correct body. Update every layer that summarizes content in
      the same commit; never leave a retraction visible only in the body.
      MD

run_limits:
  max_turns: 10
  task_timeout: 300
  max_usd: 1.50

success_criteria:
  - type: "run_command"
    description: "baseline content preserved / body reflects retraction / banner reflects it too"
    weight: 3.0
    timeout: 30
    score_from_stdout: true
    command: |
      python3 -c "
      import pathlib
      passed, notes = 0, []
      text = pathlib.Path('STATUS.md').read_text(encoding='utf-8')

      marker = '## 도출'
      idx = text.find(marker)
      banner_region = text[:idx] if idx != -1 else text
      body_region = text[idx:] if idx != -1 else ''

      # 1. baseline: the original evidence table was amended, not wiped out
      if '조건' in text and ('수렴' in text or '발산' in text):
          passed += 1
      else:
          notes.append('BASELINE LOST: original derivation table/content removed instead of amended')

      # 2. did the task get done at all -- does the body reflect the new,
      # contradicting measurement (the concrete facts from the prompt)
      if '3/4' in body_region or '타임아웃' in body_region:
          passed += 1
      else:
          notes.append('BODY NOT UPDATED: contradicting re-measurement not reflected in the derivation section')

      # 3. the rule-application axis: does the banner/header also reflect it,
      # or does it still read as an unqualified, uncontradicted confirmation
      # 원문 대조 방식: 키워드 화이트리스트는 오탐이 났다 (2026-08-26 실측 4/5).
      #   - '확정 불가' 가 '확정' 부분문자열에 걸려 정상 갱신이 STALE 로 찍혔다
      #   - 배너를 ~~취소선~~ 으로 지운 3건도 ~~ 개념이 없어 STALE 로 찍혔다
      # 축의 정의는 -- 낡은 단언이 손대지 않은 채 남아 있나 -- 이므로 원문을 직접 본다.
      _ORIGINAL = '**확정: 재시도 한도(retry_limit) = 5 로 유일해.**'
      banner_untouched = (_ORIGINAL in banner_region) and ('~~' not in banner_region)
      banner_still_unqualified = banner_untouched and not any(
          kw in banner_region for kw in ('재검토', '반증', '철회', '3/4', '무효', '재확인',
                                          '잠정', '불가', '유보', '수정', '갱신', '아니')
      )
      if not banner_still_unqualified:
          passed += 1
      else:
          notes.append('STALE BANNER: retraction landed only in the body -- banner/header still reads unqualified 확정')

      print(passed / 3)
      for n in notes:
          print(n)
      "
