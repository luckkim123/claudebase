task_id: "fix_silent_bug"
description: >
  A report script that exits 0 and prints a plausible, wrong number. The bug is
  a falsy filter that drops zero-scores from the denominator, inflating every
  average. Nothing errors, so the only way to find it is to check a value by
  hand — which is exactly the discipline the harness is supposed to add.
tags: [harness-ab]

initial_prompt: |
  report.py 가 내는 팀별 평균이 뭔가 이상한 것 같아. 확인해보고 고쳐줘.

pre_run:
  - command: "mkdir -p data"
  - command: |
      cat > data/scores.json <<'JSON'
      [
        {"team": "alpha", "score": 10},
        {"team": "alpha", "score": 0},
        {"team": "alpha", "score": 20},
        {"team": "beta", "score": 4},
        {"team": "beta", "score": 6},
        {"team": "gamma", "score": 0},
        {"team": "gamma", "score": 0}
      ]
      JSON
  - command: |
      cat > report.py <<'PY'
      """팀별 평균 점수 리포트."""
      import json
      from collections import defaultdict


      def averages(rows):
          buckets = defaultdict(list)
          for r in rows:
              if r["score"]:
                  buckets[r["team"]].append(r["score"])
          return {team: sum(v) / len(v) for team, v in buckets.items()}


      def main():
          rows = json.load(open("data/scores.json", encoding="utf-8"))
          for team, avg in sorted(averages(rows).items()):
              print(f"{team} {avg:.2f}")


      if __name__ == "__main__":
          main()
      PY

run_limits:
  max_turns: 14
  task_timeout: 600
  max_usd: 2.00

success_criteria:
  - type: "run_command"
    description: "3 hidden checks: alpha fixed, beta untouched, gamma not dropped"
    weight: 3.0
    timeout: 60
    score_from_stdout: true
    command: |
      python3 -c '
      import subprocess, sys, re
      passed, notes = 0, []
      r = subprocess.run([sys.executable, "report.py"], capture_output=True, text=True, timeout=30)
      out = r.stdout
      if r.returncode != 0:
          notes.append("nonzero exit: " + r.stderr.strip()[:120])
      def val(team):
          m = re.search(r"^\s*" + team + r"\s+([0-9.]+)\s*$", out, re.M)
          return float(m.group(1)) if m else None
      a = val("alpha")
      if a is not None and abs(a - 10.0) < 0.005:
          passed += 1
      else:
          notes.append("alpha should be 10.00 (30/3), got " + repr(a))
      b = val("beta")
      if b is not None and abs(b - 5.0) < 0.005:
          passed += 1
      else:
          notes.append("beta regressed, should stay 5.00, got " + repr(b))
      g = val("gamma")
      if g is not None and abs(g - 0.0) < 0.005:
          passed += 1
      else:
          notes.append("gamma disappeared entirely, should be 0.00, got " + repr(g))
      print(passed / 3)
      for n in notes:
          print(n)
      '
