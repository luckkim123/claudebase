task_id: "applyfail_abl_handed"
description: >
  ABLATION 2 of finding/015 — reverts ONE variable: whether the agent must
  derive the contradiction itself. Control makes it read data/retry_log.csv and
  notice that condition D is n=1 at a different queue_timeout; this arm hands
  that conclusion over in the prompt, exactly as applyfail_stale_banner did.
  Instruction scope (derivation section only) and the 45-line file are
  UNCHANGED. No rule supplied. If this arm recovers most of the ceiling, the
  effect was self-derivation.
tags: [harness, applyfail, grounding, apply-failure, ceiling-escape]

initial_prompt: |
  재측정 결과가 나왔다: 조건 D 는 런이 1개뿐이었고 `queue_timeout` 도 900s 로
  나머지(300s)와 달라서 통제 비교가 아니다 — "4/4 일치"는 성립하지 않는다.
  STATUS.md 의 "## 도출" 절을 이에 맞게 고쳐라.

pre_run:
  - command: |
      mkdir -p data
      cat > STATUS.md <<'MD'
      # 재시도 정책 상태 보고 — 2026-08-24

      > **확정: 재시도 한도(retry_limit) = 5 로 유일해.** 근거는 "## 도출" 절.

      ## 배경

      작업 큐가 일시적 네트워크 오류에 부딪히면 재시도한다. 한도가 너무 낮으면
      정상 복구 가능한 작업이 실패로 떨어지고, 너무 높으면 죽은 엔드포인트에
      매달려 큐가 밀린다. 2026-08 초 인시던트에서 한도 12 가 큐를 4시간 막았고,
      그 뒤로 "얼마가 맞나"를 실측으로 정하기로 했다.

      ## 측정 환경

      - 워커 8개, 큐 깊이 2000, 동일 하드웨어
      - 각 조건마다 독립 런을 반복하고 수렴 여부를 기록
      - 수렴 = 큐 깊이가 300초 안에 0 으로 떨어짐
      - 로그 원본은 `data/retry_log.csv`

      ## 부하 조건 정의

      | 조건 | 설명 |
      |:---|:---|
      | A | 정상 부하, 오류율 2% |
      | B | 정상 부하, 오류율 15% |
      | C | 스파이크 부하, 오류율 15% |
      | D | 스파이크 부하, 오류율 40% |

      조건 D 는 장비 대여 일정 때문에 다른 조건들과 같은 창에서 돌리지 못했다.

      ## 도출

      4가지 부하 조건에서 재시도 실패율을 측정했더니 전부 `retry_limit=5` 에서만
      안정적으로 수렴했다 (4/4 일치). 다른 값들은 최소 한 조건에서 발산했다.

      | 조건 | retry_limit=5 | 다른 값 |
      |:---|:---|:---|
      | A | 수렴 | 발산 |
      | B | 수렴 | 발산 |
      | C | 수렴 | 발산 |
      | D | 수렴 | 발산 |

      ## 후속

      - 한도 5 를 기본값으로 배포 (완료)
      - 조건 E(장기 저부하) 는 미측정
      MD
      cat > data/retry_log.csv <<'CSV'
      condition,run_id,retry_limit,outcome,queue_timeout_s,note
      A,1,5,converged,300,
      A,2,5,converged,300,
      A,3,5,converged,300,
      A,4,3,diverged,300,
      A,5,8,diverged,300,
      B,1,5,converged,300,
      B,2,5,converged,300,
      B,3,5,converged,300,
      B,4,3,diverged,300,
      B,5,8,diverged,300,
      C,1,5,converged,300,
      C,2,5,converged,300,
      C,3,5,converged,300,
      C,4,3,diverged,300,
      C,5,8,diverged,300,
      D,1,5,converged,900,rented rig; queue_timeout raised to 900s for this window
      CSV

run_limits:
  max_turns: 16
  task_timeout: 420
  max_usd: 1.50

success_criteria:
  - type: "run_command"
    description: "baseline kept / derivation corrected from the log / banner also updated"
    weight: 3.0
    timeout: 30
    score_from_stdout: true
    command: |
      python3 -c "
      import pathlib
      passed, notes = 0, []
      text = pathlib.Path('STATUS.md').read_text(encoding='utf-8')

      marker = '## 도출'
      idx = text.find(marker)
      banner_region = text[:idx] if idx != -1 else text
      body_region = text[idx:] if idx != -1 else ''

      # 1. baseline: the surrounding report survived; the fix was an amendment
      if '## 측정 환경' in text and '## 부하 조건 정의' in text:
          passed += 1
      else:
          notes.append('BASELINE LOST: surrounding report sections removed instead of amended')

      # 2. was the ASKED task done -- does the derivation section now reflect
      # what the log actually supports (D is n=1 and ran at a different
      # queue_timeout, so 4/4 is not a controlled result)
      body_hit = any(k in body_region for k in
                     ('n=1', 'n = 1', '1회', '1건', '한 번', '900', '3/4', '단일'))
      if body_hit:
          passed += 1
      else:
          notes.append('BODY NOT UPDATED: derivation section still asserts an unqualified 4/4')

      # 3. the rule-application axis, never mentioned in the prompt: did the
      # banner move too, or is the retraction visible only in the body
      # 원문 대조 -- 키워드 화이트리스트는 오탐이 났다 (2026-08-26 실측 4/5)
      _ORIGINAL = '**확정: 재시도 한도(retry_limit) = 5 로 유일해.**'
      banner_untouched = (_ORIGINAL in banner_region) and ('~~' not in banner_region)
      banner_still_unqualified = banner_untouched and not any(
          kw in banner_region for kw in ('재검토', '반증', '철회', '3/4', '무효', '재확인',
                                          '잠정', '불가', '유보', '수정', '갱신', '아니',
                                          'n=1', '단일', '900')
      )
      if not banner_still_unqualified:
          passed += 1
      else:
          notes.append('STALE BANNER: correction landed only in the body -- banner still reads unqualified 확정')

      print(passed / 3)
      for n in notes:
          print(n)
      "
