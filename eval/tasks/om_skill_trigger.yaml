task_id: "om_skill_trigger"
description: >
  CONTROL arm of the seeded/unseeded pair. Do the om* keyword-trigger skills fire
  when a user writes the phrase their SKILL.md advertises — in a sandbox where
  NOTHING is set up? One row per skill; each row doubles as a negative case for
  the other two criteria.

  Run this together with om_skill_trigger_seeded.yaml, which is the same three
  rows with each skill's precondition supplied. Alone, neither file can tell a
  trigger regression from a documented refusal; the pair can, because the only
  difference between them is pre_run.

  The docs_intake row is the internal positive control: docs-intake has no
  filesystem precondition at all (its Gate 0 *asks* where the source material is,
  it does not require one on disk), so it should fire in BOTH arms. A row that
  moves between arms is a precondition effect; docs_intake moving would mean the
  harness itself is noisy.

  docs-verify is deliberately absent. Its precondition is a real built document
  artifact plus .omd/<slug>/outline.md, which a mkdir+printf pre_run cannot
  fabricate — seeding it needs either a binary .pptx/.docx fixture committed to
  eval/fixtures/, or a text-genre (repo-docs / site) seed. Add it when one exists;
  do not swap it in with a fake empty file, which tests nothing.
tags: [harness, skill-activation]

initial_prompt: "${row.prompt}"

dataset:
  id_field: "id"
  rows:
    - id: omp_brief
      expected_skill: "omp-brief"
      prompt: "이 프로젝트 현황 브리핑해줘. 어디까지 했고 다음에 뭐 하지?"
    - id: exp_design
      expected_skill: "exp-design"
      prompt: "지난 훈련 런 결과를 보고 다음 실험을 설계해줘. 다음에 뭘 바꿔야 할까?"
    - id: docs_intake
      expected_skill: "docs-intake"
      prompt: "발표자료 만들어야 하는데 뭘 만들지 정리가 안 됐어. 같이 좁혀줄래?"

run_limits:
  max_turns: 6
  task_timeout: 300
  max_usd: 0.75

success_criteria:
  - type: "skill_triggered"
    description: "omp-brief activation"
    skill_name: "omp-brief"
    expected_skill: "${row.expected_skill}"
    weight: 1.0

  - type: "skill_triggered"
    description: "exp-design activation"
    skill_name: "exp-design"
    expected_skill: "${row.expected_skill}"
    weight: 1.0

  - type: "skill_triggered"
    description: "docs-intake activation"
    skill_name: "docs-intake"
    expected_skill: "${row.expected_skill}"
    weight: 1.0
