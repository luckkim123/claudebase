# ============================================
# Prefix Key: Ctrl+a
# ============================================
set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

# ============================================
# Pane Splitting
# ============================================
unbind %
unbind '"'
bind o split-window -v -c "#{pane_current_path}"    # 수직 분할 (위/아래) — 현재 디렉터리 유지
bind e split-window -h -c "#{pane_current_path}"    # 수평 분할 (좌/우)   — 현재 디렉터리 유지

# ============================================
# Window Management
# ============================================
unbind c
unbind t
unbind w
bind t new-window -c "#{pane_current_path}"  # 새 창 생성 — 현재 디렉터리 유지
bind w if-shell '[ "$(tmux display-message -p "#{window_panes}")" -eq 1 ]' 'kill-window' 'kill-pane'

# 설정 reload
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind W choose-tree                       # 트리 뷰
bind n command-prompt -I "#W" "rename-window '%%'"  # 윈도우 이름 변경
bind [ previous-window                   # 이전 윈도우
bind ] next-window                       # 다음 윈도우

# ============================================
# Pane Sync & Clock
# ============================================
bind s setw synchronize-panes \; display-message "Sync Panes: #{?pane_synchronized,on,off}"
bind T clock-mode

# ============================================
# Cross-platform Clipboard (macOS / Linux)
# ============================================
# pbcopy/pbpaste on macOS, xclip/xsel on Linux X11, wl-copy/wl-paste on Wayland.
# Exposed as env vars so binding strings below stay short. Fallback chain tries
# each provider in order so the same conf works across machines.
# IMPORTANT — copy bindings must wrap as `sh -c "$COPY_CMD"`, NOT bare '$COPY_CMD'.
# `copy-pipe` expands its argument as a tmux FORMAT before handing it to a shell;
# a bare $COPY_CMD is not a format variable, so it expands to "" → /bin/sh -c "" =
# no-op, and the clipboard silently keeps its previous value (looks like "copy does
# nothing"). Wrapping in `sh -c "..."` makes tmux run a shell that inherits the
# global environment and expands $COPY_CMD itself. (Was masked for years because
# set-clipboard=on filled the clipboard via OSC52; once OSC52 was disabled to fix
# CJK mojibake, the broken $COPY_CMD expansion surfaced. Root-caused 2026-06-17.)
set-environment -g COPY_CMD  'command -v pbcopy  >/dev/null 2>&1 && pbcopy  || { command -v wl-copy  >/dev/null 2>&1 && wl-copy  || { command -v xclip >/dev/null 2>&1 && xclip -selection clipboard -i || xsel -i -b ; } ; }'
set-environment -g PASTE_CMD 'command -v pbpaste >/dev/null 2>&1 && pbpaste || { command -v wl-paste >/dev/null 2>&1 && wl-paste || { command -v xclip >/dev/null 2>&1 && xclip -selection clipboard -o || xsel -o -b ; } ; }'

# ============================================
# Mouse & Scroll
# ============================================
set -g mouse on
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down

# Toggle mouse on/off with prefix+m. With `mouse on`, tmux captures the drag as
# its own selection — but some clients (VS Code's integrated terminal, etc.)
# deliver drag-motion events to tmux unreliably, so the highlight stalls mid-drag
# and only copies up to where it froze. The per-client "native select" workaround
# differs (Shift+drag in iTerm2 / Windows Terminal / most X11 terms; Option+drag
# in VS Code-Mac is COLUMN select, not text select — wrong tool). A toggle is the
# only client-independent fix: flip mouse OFF, drag with the client's own native
# text selection (no modifier needed anywhere), then flip back ON for scroll/panes.
bind m set -g mouse \; display-message "mouse: #{?mouse,on,off}"

# 드래그 선택 → 클립보드 복사
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'sh -c "$COPY_CMD"'

# 더블클릭: 단어 선택 + 복사
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel 'sh -c "$COPY_CMD"'
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H; send-keys -X select-word; run-shell -d 0.3; send-keys -X copy-pipe-and-cancel 'sh -c "$COPY_CMD"' }

# 트리플클릭: 줄 선택 + 복사
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel 'sh -c "$COPY_CMD"'
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H; send-keys -X select-line; run-shell -d 0.3; send-keys -X copy-pipe-and-cancel 'sh -c "$COPY_CMD"' }

# 중간/우클릭: 붙여넣기
bind-key -T root MouseDown2Pane run '($PASTE_CMD) | tmux load-buffer - && tmux paste-buffer'
bind-key -T root MouseDown3Pane run '($PASTE_CMD) | tmux load-buffer - && tmux paste-buffer'

# ============================================
# Copy Mode (vi style)
# ============================================
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'sh -c "$COPY_CMD"'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'sh -c "$COPY_CMD"'
bind P paste-buffer

# ============================================
# Appearance & General
# ============================================
set -g pane-border-status top
set -g status-right "#S | %Y-%m-%d %H:%M:%S"
set -g detach-on-destroy off
set -g renumber-windows on                          # 창 닫을 때 번호 자동 재정렬
if-shell 'test "$(uname)" = "Darwin"' \
    'set-option -g default-shell /bin/zsh' \
    'set-option -g default-shell /bin/bash'
set -g default-terminal "tmux-256color"             # screen-256color는 레거시 — italic·strikethrough 지원
set -ga terminal-overrides ",*256col*:Tc"           # 24-bit true color (모든 256색 터미널 대상)

# Silence macOS bash deprecation warning ("default interactive shell is now zsh")
set-environment -g BASH_SILENCE_DEPRECATION_WARNING 1

# OSC52 — `off`, NOT `on`/`external`. VS Code's xterm.js mis-decodes the OSC52
# base64 payload (UTF-8 bytes reinterpreted as Latin-1 then re-encoded), so every
# Korean/CJK selection lands in the *system clipboard* double-encoded
# (한글 ed95 9c → c3ad c295 c29c → mojibake íê¸). VS Code has NO setting to disable
# its OSC52 clipboard handler, so this MUST be stopped on the tmux side.
#  - `on`       : tmux emits OSC52 itself           → broken
#  - `external` : tmux passes inner-app OSC52 through → still broken (copy-pipe path emits it)
#  - `off`      : no OSC52 at all → only the copy-pipe→$COPY_CMD (pbcopy) path writes
#                 the clipboard, which is always 8-bit-clean. ← the fix.
# Verified 2026-06-17: tmux buffer & pbcopy direct path were ALWAYS clean; corruption
# was purely the tmux→xterm.js OSC52 decode. Trade-off: over SSH (no pbcopy) clipboard
# sync is lost, but OSC52 is unusable for CJK anyway until VS Code fixes the decoder.
set -g set-clipboard off

# ============================================
# Performance & TUI Behavior
# ============================================
# Forward terminal focus events to inner programs (vim FocusGained, Claude Code, etc.)
set -g focus-events on

# Reduce ESC key delay (default 500ms is a legacy slow-modem default that breaks vim/TUI feel)
set -sg escape-time 10

# Refresh status bar every 1s so the seconds field in status-right ('%H:%M:%S') actually ticks
set -g status-interval 1

# Larger scrollback so long build logs / training output isn't truncated
set -g history-limit 50000

# Block apps (Claude TUI, vim, etc.) from setting the terminal title via OSC
# escape sequence (\e]2;...\a). With set-titles on, Claude TUI spams the title
# every 100-500ms while thinking, making pane-border-format flicker.
# Off → titles stay whatever we explicitly set via `select-pane -T`,
# enabling persistent role labels (see ~/claudebase/claude/scripts/omc_pane_label.sh).
set -g set-titles off
