name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check runtime/hooks/ installer/scripts/ tests/
      - name: shellcheck
        # --severity=error: warning/info noise is tracked as P3 backlog
        # (install.sh modularization will clean most of it). Errors fail CI.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error \
            installer/install.sh \
            installer/scripts/*.sh \
            platform/linux/install.sh \
            platform/macos/install.sh \
            tests/smoke/*.sh

  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run unit tests
        run: python -m pytest tests/ -v

  smoke:
    # Smoke runs install.sh twice and verifies the 2nd run is idempotent.
    # Ubuntu only — the macOS runner cost isn't justified for a contract that
    # is OS-agnostic (the bug class is in install.sh logic, not OS specifics).
    name: install.sh idempotency
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jq (statusLine renderer dep)
        run: sudo apt-get install -y -qq jq
      - name: Run idempotency smoke
        run: bash tests/smoke/test_install_idempotent.sh
